<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>쥐 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E3E1CD; --ink:#422F12; --card:#F6F3E4; --card2:#EFEBD6; --soft:#CFC9AE;
  --pink:#F4B6C2; --pink2:#E98AA0; --mint:#BFE3CF; --sky:#BBD8EE; --butter:#F6E3A1; --lav:#D6C6EC;
  --px:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Jua',system-ui,sans-serif;font-size:15px;line-height:1.35;
  -webkit-tap-highlight-color:transparent;overflow:hidden;
  background-image:radial-gradient(rgba(66,47,18,.07) 1.5px,transparent 1.6px);background-size:18px 18px}
button,input,select{font-family:inherit;color:inherit;font-size:inherit}
.hidden{display:none!important}
img.px,canvas{image-rendering:pixelated;image-rendering:crisp-edges}

/* ---------- pixel box ---------- */
.pbox{background:var(--card);position:relative;
  box-shadow:0 calc(var(--px)*-1) 0 0 var(--ink),0 var(--px) 0 0 var(--ink),calc(var(--px)*-1) 0 0 0 var(--ink),var(--px) 0 0 0 var(--ink),
  inset 0 calc(var(--px)*-1) 0 0 rgba(66,47,18,.12);margin:var(--px)}
.pbtn{border:0;cursor:pointer;background:#FFFBEF;padding:8px 12px;position:relative;user-select:none;
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),inset 0 -4px 0 0 rgba(66,47,18,.16);
  margin:3px;transition:transform .05s}
.pbtn:hover{background:#fff}
.pbtn:active{transform:translateY(2px);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),inset 0 2px 0 0 rgba(66,47,18,.16)}
.pbtn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.pbtn.pink{background:var(--pink)} .pbtn.mint{background:var(--mint)} .pbtn.sky{background:var(--sky)}
.pbtn.butter{background:var(--butter)} .pbtn.lav{background:var(--lav)} .pbtn.ink{background:var(--ink);color:var(--card)}
.pbtn.sm{padding:4px 8px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card2);padding:2px 8px;font-size:12px;
  box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink);margin:2px 3px}
.ico{width:20px;height:20px;vertical-align:middle;flex:none;object-fit:contain}
.ico.lg{width:30px;height:30px}.ico.xl{width:40px;height:40px}
.input{width:100%;background:#FFFDF4;border:0;padding:8px 10px;outline:none;
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),inset 0 3px 0 0 rgba(66,47,18,.1);margin:3px}
.input:focus{background:#fff}
label.f{display:block;font-size:13px;margin:10px 0 4px 2px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{flex:1 1 auto;min-width:60px}
.seg button.on{background:var(--pink)}
.mbti{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.mbti button{margin:3px;padding:6px 0;font-size:13px;letter-spacing:.5px}
.mbti button.on{background:var(--pink)}
.muted{opacity:.65}
h2{font-size:20px;font-weight:400}
h3{font-size:16px;font-weight:400}

/* ---------- setup ---------- */
#setup{position:fixed;inset:0;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:28px 14px}
.setup-card{width:min(520px,100%);padding:20px 20px 22px}
.setup-title{text-align:center;margin-bottom:6px}
.setup-title h1{font-size:30px;font-weight:400;letter-spacing:1px}
.steps{display:flex;justify-content:center;gap:8px;margin:6px 0 14px;font-size:13px}
.steps span{padding:2px 10px;background:var(--card2)}
.steps span.on{background:var(--pink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.preview{display:flex;justify-content:center;align-items:flex-end;padding-bottom:10px;height:150px;background:#F2EEDB;margin:6px 3px 4px;
  background-image:linear-gradient(transparent 78%,#E8DDBE 78%)}
.swatches{display:flex;flex-wrap:wrap;gap:6px;margin:4px 2px}
.sw{width:30px;height:30px;border:0;cursor:pointer;box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink);margin:2px}
.sw.on{outline:3px solid var(--pink2);outline-offset:3px}
.colorrow{display:flex;align-items:center;gap:8px;margin-top:6px}
.colorrow input[type=color]{width:42px;height:34px;border:0;padding:0;background:none;cursor:pointer}
.pdesc{font-size:12px;margin:4px 2px 0;min-height:16px}
.setup-actions{display:flex;justify-content:space-between;margin-top:18px;gap:8px}

/* ---------- layout ---------- */
#game{height:100%;display:grid;grid-template-columns:250px 1fr}
#side{padding:16px 12px;display:flex;flex-direction:column;gap:12px;border-right:3px solid var(--ink);background:rgba(246,243,228,.55);overflow:auto}
.logo{display:flex;align-items:center;gap:8px;font-size:22px;padding:2px 4px}
.owner-card{padding:10px 12px;font-size:13px}
.owner-card b{font-weight:400;font-size:16px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;font-size:16px;padding:9px 12px}
.nav button.on{background:var(--pink)}
.seedbox{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:16px}
.side-foot{margin-top:auto;font-size:11px;opacity:.6;padding:0 4px}
#topbar{display:none}
#main{overflow:hidden;position:relative;height:100%}
.view{display:none;height:100%;flex-direction:column}
.view.active{display:flex}
.vhead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 6px}
.vhead .close{display:none}
.vbody{flex:1;overflow:auto;padding:8px 20px 24px}

/* ---------- home ---------- */
#v-home{max-width:620px;margin:0 auto;width:100%;padding:12px 16px 14px;gap:8px}
.home-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px}
.home-head .nm{font-size:20px}
.home-head .nk{font-size:13px;opacity:.7;margin-left:4px}
.home-head .meta{display:flex;flex-wrap:wrap;justify-content:flex-end}

.stage{--floor:46px;flex:1;min-height:170px;position:relative;overflow:hidden;
  background:#F4F0DE;
  background-image:
   linear-gradient(transparent calc(100% - var(--floor)),#E2D2AC calc(100% - var(--floor)),#E2D2AC calc(100% - var(--floor) + 4px),#EADDBC calc(100% - var(--floor) + 4px),#EADDBC calc(100% - var(--floor) + 7px),#F0E5C8 calc(100% - var(--floor) + 7px));
}
.stage .floor-dots{position:absolute;left:0;right:0;bottom:0;height:calc(var(--floor) - 7px);
  background-image:radial-gradient(#D9C69A 1.6px,transparent 1.7px),radial-gradient(#E2D1A8 1.6px,transparent 1.7px);
  background-size:22px 14px,30px 18px;background-position:4px 4px,14px 10px;opacity:.9}
.stage .window{position:absolute;top:14px;left:16px;width:66px;height:50px;background:#CFE6F4;
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink);
  background-image:linear-gradient(90deg,transparent 31px,var(--ink) 31px,var(--ink) 34px,transparent 34px),linear-gradient(transparent 23px,var(--ink) 23px,var(--ink) 26px,transparent 26px)}
.stage .window i{position:absolute;width:14px;height:6px;background:#fff;top:10px;left:8px;box-shadow:6px -4px 0 0 #fff,40px 22px 0 0 #fff,46px 18px 0 0 #fff}
.mouse-wrap{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);transform-origin:50% 100%}
.mouse-inner{transform-origin:50% 100%}
.mouse-inner.boing{animation:boing .42s linear 1}
.mouse-inner.shake{animation:shake .52s steps(1) 1}
#mouseCv{cursor:pointer;touch-action:manipulation;display:block}
.mouse-inner.jump{animation:jump .75s linear 1}
.mouse-inner.happy{animation:happy 1.1s steps(1) 1}
@keyframes idle{0%{transform:scale(1,1)}50%{transform:scale(1.02,.975)}}
@keyframes jump{
 0%{transform:translateY(0) scale(1.1,.88)}12%{transform:translateY(-12px) scale(.94,1.08)}
 30%{transform:translateY(-40px) scale(.96,1.05)}45%{transform:translateY(-50px) scale(1,1)}
 62%{transform:translateY(-36px) scale(1,1.02)}82%{transform:translateY(0) scale(1.12,.86)}
 92%{transform:translateY(-6px) scale(.98,1.03)}100%{transform:translateY(0) scale(1,1)}}
@keyframes boing{0%{transform:scale(1.12,.86)}30%{transform:translateY(-18px) scale(.94,1.08)}60%{transform:translateY(-6px) scale(1,1)}85%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
@keyframes shake{0%{transform:translateX(0)}15%{transform:translateX(-8px)}30%{transform:translateX(8px)}45%{transform:translateX(-6px)}60%{transform:translateX(6px)}75%{transform:translateX(-3px)}100%{transform:none}}
@keyframes happy{
 0%{transform:rotate(0) translateY(0)}12%{transform:rotate(-8deg) translateY(-8px)}24%{transform:rotate(8deg) translateY(0)}
 36%{transform:rotate(-8deg) translateY(-8px)}48%{transform:rotate(8deg) translateY(0)}60%{transform:rotate(-5deg) translateY(-6px)}
 72%{transform:rotate(5deg) translateY(0)}86%{transform:rotate(0) translateY(-4px)}100%{transform:rotate(0) translateY(0)}}
.doll{position:absolute;bottom:22px;transform-origin:50% 100%;animation:idle 2.2s steps(1) infinite;cursor:pointer}
.doll-tag{position:absolute;transform:translateX(-50%);z-index:5;font-size:12px;background:#fff;pointer-events:none;white-space:nowrap}
.mouse-inner.rise{animation:rise .3s steps(3) 1}
@keyframes rise{0%{transform:scale(1.06,.9)}60%{transform:scale(.97,1.05)}100%{transform:none}}
.shadow{position:absolute;left:50%;bottom:16px;height:10px;background:rgba(66,47,18,.13);transform:translateX(-50%)}
.bubble{position:absolute;top:14px;right:14px;max-width:62%;background:#fff;padding:8px 12px;font-size:15px;z-index:3;
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink);
  animation:pop .18s steps(2)}
.bubble:after{content:"";position:absolute;bottom:-9px;left:22px;width:12px;height:9px;background:#fff;box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.bubble:before{content:"";position:absolute;bottom:-15px;left:25px;width:6px;height:6px;background:#fff;z-index:1;box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 3px 0 0 var(--ink)}
.bubble .who{font-size:11px;opacity:.6;display:block}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.fav{position:absolute;left:10px;bottom:8px;z-index:2;font-size:12px;background:rgba(255,255,255,.75)}
.sound-btn{position:absolute;right:10px;bottom:8px;z-index:2;border:0;cursor:pointer;background:rgba(255,255,255,.75)}
.squeak{position:absolute;left:58%;bottom:calc(100% + 14px);transform:translateX(-50%);white-space:nowrap;background:#fff;padding:5px 11px;font-size:16px;z-index:5;pointer-events:none;
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink);animation:sqpop .22s steps(3)}
.squeak:after{content:"";position:absolute;bottom:-9px;left:calc(50% - 6px);width:12px;height:9px;background:#fff;box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.squeak:before{content:"";position:absolute;bottom:-15px;left:calc(50% - 3px);width:6px;height:6px;background:#fff;z-index:1;box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 3px 0 0 var(--ink)}
@keyframes sqpop{0%{transform:translateX(-50%) translateY(6px) scale(.6)}100%{transform:translateX(-50%) scale(1)}}
.pt.sparkle{animation:twinkle .9s steps(5) forwards}
@keyframes twinkle{0%{transform:scale(0) rotate(0);opacity:1}35%{transform:scale(1.15) rotate(0)}55%{transform:scale(.55)}75%{transform:scale(1)}100%{transform:scale(0);opacity:.6}}
.stink{position:absolute;width:12px;opacity:.8;animation:stink 1.6s steps(4) infinite;z-index:2}
@keyframes stink{0%{transform:translateY(0);opacity:0}30%{opacity:.8}100%{transform:translateY(-22px);opacity:0}}
.pt{position:absolute;z-index:4;pointer-events:none;animation:floatUp 1.1s steps(8) forwards}
@keyframes floatUp{0%{transform:translate(0,0) scale(.7);opacity:1}50%{transform:translate(calc(var(--dx) * -.4),-45px) scale(1)}100%{transform:translate(var(--dx),-95px) scale(1.1);opacity:0}}
.away{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:3;text-align:center;padding:12px}
.away .track{position:relative;width:min(320px,86%);height:62px;overflow:hidden}
.away .walker{position:absolute;bottom:4px;animation:walk 6s linear infinite}
.away .walker canvas{animation:bob .4s steps(1) infinite}
@keyframes walk{0%{left:-10%;transform:scaleX(1)}49%{left:80%;transform:scaleX(1)}50%{left:80%;transform:scaleX(-1)}99%{left:-10%;transform:scaleX(-1)}100%{left:-10%;transform:scaleX(1)}}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.pbar{width:min(300px,84%);height:16px;background:#fff;position:relative;
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--pink2)}
.thought-row{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px}
.thought-row .t{flex:1;font-size:15px;min-width:0}
.thought-row .t.secret,.thought-row .secret{letter-spacing:3px;opacity:.55}
.thought-row .ctx{font-size:11px;margin:0 6px 0 0;vertical-align:1px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:10px 12px}
.stat{display:flex;align-items:center;gap:6px;font-size:13px;min-width:0}
.stat .lb{width:52px;flex:none;white-space:nowrap}
.stat .bar{flex:1;height:12px;display:flex;gap:2px;min-width:0}
.stat .bar i{flex:1;background:#E7E1C8}
.stat .v{width:28px;text-align:right;flex:none;font-size:12px}
.stat.num{justify-content:space-between}
.stat.num b{font-weight:400;font-size:16px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.actions .pbtn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 7px;font-size:14px}
.actions .pbtn small{font-size:11px;opacity:.7;line-height:1}

/* ---------- lists ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card .top{display:flex;align-items:center;gap:10px}
.card .nm{font-size:17px}
.card .ds{font-size:13px;opacity:.8}
.card .bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:4px}
.price{display:flex;align-items:center;gap:4px;font-size:16px}
.region{padding:0;overflow:hidden}
.region .banner{height:70px;display:flex;align-items:center;justify-content:center;gap:10px}
.region .in{padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px}
.odds{display:flex;flex-wrap:wrap;gap:2px}
.odds .chip{font-size:11px}
.note{font-size:12px;opacity:.7;margin:4px 2px 12px}
.capbar{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:12px;flex-wrap:wrap}
.capbar .pbar{flex:1;min-width:140px;width:auto}
.empty{padding:30px;text-align:center;opacity:.65}
.kv{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;font-size:14px}
.kv dt{opacity:.65}
.section{padding:14px 16px;margin-bottom:14px}
.section h3{margin-bottom:10px}

/* ---------- modal / toast ---------- */
#modal{position:fixed;inset:0;background:rgba(66,47,18,.35);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-box{width:min(420px,100%);max-height:90vh;overflow:auto;padding:16px 18px}
.modal-box h2{margin-bottom:10px}
.modal-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:14px;flex-wrap:wrap}
.reward-list{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.reward{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#fff}
#toasts{position:fixed;left:50%;top:16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:200;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--ink);color:var(--card);padding:8px 14px;font-size:14px;animation:pop .2s steps(2);
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
#drawer{display:none}

/* ---------- mobile ---------- */
@media (max-width:860px){
  #game{grid-template-columns:1fr;grid-template-rows:54px 1fr}
  #side{display:none}
  #topbar{display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:3px solid var(--ink);background:var(--card)}
  #topbar .logo{font-size:19px}
  #v-home{display:flex!important;padding:8px 10px 10px;gap:6px}
  .view:not(#v-home).active{position:fixed;inset:0;z-index:60;background:var(--bg);
    background-image:radial-gradient(rgba(66,47,18,.07) 1.5px,transparent 1.6px);background-size:18px 18px;animation:slideUp .2s steps(3)}
  .vhead{border-bottom:3px solid var(--ink);background:var(--card);padding:10px 12px}
  .vhead .close{display:inline-block}
  .vbody{padding:12px 12px 24px}
  #drawer{position:fixed;inset:0;z-index:80;background:rgba(66,47,18,.35)}
  #drawer.open{display:block}
  #drawer .panel{position:absolute;top:8px;left:8px;right:8px;padding:12px;display:flex;flex-direction:column;gap:10px;animation:slideDown .18s steps(3)}
  .stats{gap:5px 10px;padding:8px 10px}
  .stat .lb{width:auto;min-width:38px;font-size:12px}
  #toasts{top:64px}
  .home-head{padding:6px 10px}
  .home-head .nm{font-size:18px}
}
@keyframes slideUp{0%{transform:translateY(30px);opacity:0}100%{transform:none;opacity:1}}
@keyframes slideDown{0%{transform:translateY(-20px);opacity:0}100%{transform:none;opacity:1}}
@media (max-width:400px){
  .actions .pbtn{font-size:13px}
  .stat .v{display:none}
}
</style>
</head>
<body>

<!-- ===================== SETUP ===================== -->
<div id="setup" class="hidden">
  <div class="setup-card pbox">
    <div class="setup-title">
      <canvas id="logoCv"></canvas>
      <h1>쥐 키우기</h1>
      <div class="muted" style="font-size:13px">작고 소중한 나의 쥐와 함께하는 하루</div>
    </div>
    <div class="steps"><span id="st1" class="on">1. 주인 정보</span><span id="st2">2. 쥐 정보</span></div>

    <div id="step1">
      <label class="f">이름 *</label>
      <input class="input" id="oName" maxlength="12" placeholder="주인님 이름">
      <div class="row2">
        <div><label class="f">성별</label>
          <div class="seg" id="oGender"></div></div>
        <div><label class="f">나이</label>
          <input class="input" id="oAge" type="number" min="1" max="120" placeholder="예: 25"></div>
      </div>
      <label class="f">성격 <span class="muted">(쥐에게 건네는 말투가 달라져요)</span></label>
      <div class="seg" id="oPers"></div>
      <div class="pdesc" id="oPersDesc"></div>
      <label class="f">MBTI <span class="muted">(선택 · 다시 누르면 해제)</span></label>
      <div class="mbti" id="oMbti"></div>
      <div class="setup-actions"><span></span><button class="pbtn pink" id="toStep2">다음 ▶</button></div>
    </div>

    <div id="step2" class="hidden">
      <div class="preview pbox" style="margin:6px 3px 10px"><canvas id="setupCv"></canvas></div>
      <div class="row2">
        <div><label class="f">쥐 이름 *</label><input class="input" id="mName" maxlength="10" placeholder="예: 쥐롱"></div>
        <div><label class="f">애칭 (선택)</label><input class="input" id="mNick" maxlength="10" placeholder="예: 쪼꼬미"></div>
      </div>
      <label class="f">털 색상</label>
      <div class="swatches" id="mSwatches"></div>
      <div class="colorrow"><input type="color" id="mColor" value="#32312F"><input class="input" id="mHex" maxlength="7" style="width:110px" value="#32312F"><span class="muted" style="font-size:12px">직접 고르기</span></div>
      <label class="f">성별</label>
      <div class="seg" id="mGender"></div>
      <label class="f">성격</label>

/* ---------- 반복을 줄이는 대사 뽑기 (셔플 백) ---------- */
const BAGS={};
function bag(key,arr){
  let b=BAGS[key];
  if(!b||!b.q.length||b.n!==arr.length){
    const q=arr.slice();
    for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]]}
    if(b&&q.length>1&&q[q.length-1]===b.last)[q[0],q[q.length-1]]=[q[q.length-1],q[0]];
    b=BAGS[key]={q,n:arr.length,last:b?.last};
  }
  const v=b.q.pop();b.last=v;return v;
}
/* ---------- 이름·조사 채우기 ---------- */
const JOSA={이:['이','가'],가:['이','가'],은:['은','는'],는:['은','는'],을:['을','를'],를:['을','를'],아:['아','야'],야:['아','야'],과:['과','와'],와:['과','와'],이랑:['이랑','랑'],랑:['이랑','랑'],으로:['으로','로'],로:['으로','로']};
function jong(w){const c=String(w).charCodeAt(String(w).length-1);return c>=0xAC00&&c<=0xD7A3?(c-0xAC00)%28:0}
function jo(w,j){const p=JOSA[j];if(!p)return j;const t=jong(w);if((j==='으로'||j==='로')&&t===8)return'로';return t?p[0]:p[1]}
function fill(t){
  return t.replace(/\{([mnofd])(이랑|으로|[이가은는을를아야과와랑로])?\}/g,(_,k,j)=>{
    const w={m:S.mouse.name,n:S.mouse.nick||S.mouse.name,o:S.owner.name,f:S.fav,d:(S.dollInfo||{name:'말랑이'}).name}[k]||'';
    return j?w+jo(w,j):w});
}
/* 주인이 하는 말 */
function ownerTalk(sit){
  const op=S.owner.personality,said=OWNER_SAY[op]?.[sit];if(!said)return;
  say(fill(bag('os:'+op+':'+sit,said)));
}
/* 쥐: 상황·성격·상태에 맞는 속마음 */
function mouseThought(ctx,{annoyed=false}={}){
  const st=S.stats,p=S.mouse.personality;
  const conds=[];
  if(st.full<25)conds.push('hungry');
  if(st.clean<30)conds.push('dirty');
  if(st.stress>=70)conds.push('stressed');
  if(st.happy>=90)conds.push('joy');
  if(st.aff>=100)conds.push('love');
  if((ctx==='feed'||ctx==='snack')&&st.full>=95)conds.push('stuffed');
  let key,pool;
  if(annoyed){key='st:annoyed';pool=MT_STATE.annoyed}
  else if(conds.length&&Math.random()<.35){const c=pick(conds);key='st:'+c;pool=MT_STATE[c]}
  else if(MOUSE_T[p]?.[ctx]){key='mt:'+p+':'+ctx;pool=MOUSE_T[p][ctx]}
  else{key='mg:'+ctx;pool=MT_GEN[ctx]||MT_IDLE}
  S.thought=fill(bag(key,pool));S.thoughtCtx=ctx;S.thoughtOpen=false;S.thoughtAt=Date.now();
}

const MOUSE_DEFAULT='#32312F';
function mousePalette(base){
  const l=rgbToHsl(...hexToRgb(base))[2];
  return{k:'#000000',b:base,s:base.toUpperCase()===MOUSE_DEFAULT?'#2C2B29':shade(base,-(.015+.06*l)),
    p:'#F5ABA8',P:'#D0837D',n:'#483632',e:'#000000',w:'#7D766E',d:'#8B6B45',
    f:'#FFFFFF',F:'#CFE9F6',O:'#8FC3DC',W:'#FFFFFF'};
}
function buildMouse(o={}){
  const{pose='lie',color=MOUSE_DEFAULT,weight=25,face='normal',twitch=false,breath=false,look=false,tail=false,
        dirty=false,foam=false,shine=false,plush=false}=o;
  const PZ=POSES[pose]||POSES.lie;
  const g=PZ.t.map(r=>r.split(''));
  const H=g.length,W=g[0].length;
  const get=(x,y)=>g[y]?.[x];
  const put=(x,y,c)=>{if(y>=0&&y<H&&x>=0&&x<W)g[y][x]=c};
  const find=ch=>{for(let y=0;y<H;y++){const x=g[y].indexOf(ch);if(x>=0)return[x,y]}return[0,0]};
  const[ex,ey]=find('e'),[nx,ny]=find('n');
  // 얼룩 / 반짝
  if(dirty)[[8,9],[9,10],[13,11],[15,8],[11,7],[6,11]].forEach(([x,y])=>{if('bs'.includes(get(x,y)))put(x,y,'d')});
  if(shine)[[8,6],[9,6],[11,7],[17,6],[8,9],[9,12]].forEach(([x,y])=>{if('bs'.includes(get(x,y)))put(x,y,'W')});
  // 눈
  if(face==='blink')put(ex,ey,'s');
  else if(face==='happy'){put(ex-1,ey+1,'e');put(ex+1,ey+1,'e')}
  else if(face==='tired'){put(ex,ey,'s');put(ex-1,ey+1,'e');put(ex,ey+1,'e')}
  else if(look){put(ex,ey,'b');put(ex-1,ey,'e')}
  // 코 (씰룩: 코끝이 앞으로 1px 킁킁)
  let nX=nx;
  if(twitch&&!plush){put(nx,ny,'b');put(nx+1,ny,'n');nX=nx+1}
  // 수염
  if(!plush){
    const wp=twitch?[[1,-1],[2,-1],[1,1],[2,1]]:[[1,-1],[2,-2],[1,1],[2,2]];
    wp.forEach(([dx,dy])=>{if(get(nX+dx,ny+dy)==='.')put(nX+dx,ny+dy,'w')});
  }
  // 꼬리 끝 살랑
  if(tail){const y=H-1,x=g[y].indexOf('p');if(x>=0){put(x,y,'.');put(x+2,y,'p')}}
  // 목욕 거품: 동글동글한 거품 도장을 등·머리 위에 하나씩
  if(foam&&pose==='lie'){
    const BUB={L:[".OOO.","OWffO","OfffO","OffFO",".OOO."],M:[".OO.","OWfO","OfFO",".OO."],S:[".O.","OWO",".O."]};
    [['L',4,3],['L',8,3],['M',6,1],['S',11,1],['S',3,1]].forEach(([t,bx,by])=>
      BUB[t].forEach((row,dy)=>[...row].forEach((c,dx)=>{if(c!=='.')put(bx+dx,by+dy,c)})));
  }
  // 체중 & 숨쉬기 → 몸통 행/열 복제
  const dc=clamp(Math.round((weight-25)/3),-2,5);
  const dr=clamp(Math.round((weight-25)/6),-1,3)+(breath?1:0);
  for(let i=0;i<dr;i++)g.splice(PZ.row,0,g[PZ.row].slice());
  for(let i=0;i>dr;i--)g.splice(PZ.row,1);
  for(let i=0;i<dc;i++)g.forEach(r=>r.splice(PZ.col,0,r[PZ.col]));
  for(let i=0;i>dc;i--)g.forEach(r=>r.splice(PZ.col,1));
  while(g.length&&g[0].every(c=>c==='.'))g.shift();
  return{grid:g,C:mousePalette(color)};
}
function drawMouse(cv,opts={}){
  const{grid,C}=buildMouse(opts);const h=grid.length,w=grid[0].length;
  cv.width=w;cv.height=h;const ctx=cv.getContext('2d');ctx.clearRect(0,0,w,h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const c=grid[y][x];if(c!=='.'){ctx.fillStyle=C[c]||c;ctx.fillRect(opts.flip?w-1-x:x,y,1,1)}}
  return cv;
}

const iconCache={};
function iconURL(name){
  if(iconCache[name])return iconCache[name];
  if(name==='doll'){const c=document.createElement('canvas');drawMouse(c,{color:'#D8B48A',plush:true});return iconCache[name]=c.toDataURL()}
  const ic=ICONS[name];if(!ic)return'';
  const h=ic.d.length,w=ic.d[0].length;
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');
  ic.d.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='.'||ch===' ')return;ctx.fillStyle=ch==='k'?INK:(ic.p[ch]||'#f0f');ctx.fillRect(x,y,1,1)}));
  return iconCache[name]=cv.toDataURL();
}

/* ---------- 쥐 클릭 반응: 찍찍 말풍선 ---------- */
const SQ_BASE=['찍!','찍찍!','찍찍찍!','찌익?','쮝!','찍...?','찌이이익~','찍찍 ♪','찍? 찍찍!','쮸뀩!','찍찍찍찍!!','...찍.','찍! 찍!','찌직?','찍찍~ 찍!','찍(갸웃)','찍찍? (뭐예요?)','찍! (안녕하세요)'];
const SQ_ANNOY=['찌이익!! (그만 만져요!)','찍!!! (간지러워요!)','찍찍찍찍찍!!!','쮝!! (흥!)'];
let pokeTimes=[],lastSq='',sqT=null;
function squeakContext(){
  const st=S.stats,c=[];
  if(st.full<30)c.push('찍... (배고파요)','꼬르륵... 찍');

  if(S.doll)c.push(fill('찍찍! ({d은} 내 친구예요)'));
  return c;
}
function poke(){
  if(!S||S.adv)return;
  const now=Date.now();pokeTimes=pokeTimes.filter(t=>now-t<2500);pokeTimes.push(now);
  let line,type,face=null;
  if(pokeTimes.length>=6){line=pick(SQ_ANNOY);type='shake';face='tired';pokeTimes=[]}
  else{
    const r=Math.random(),ctx=squeakContext();
    if(r<.3&&ctx.length)line=pick(ctx);
    else if(r<.5)line=bag('sq:'+S.mouse.personality,SQ_PERS[S.mouse.personality]||SQ_BASE);
    else line=bag('sq:base',SQ_BASE);
    type=pick(['boing','boing','boing','happy','jump']);
  }
  lastSq=line;squeak(line);playAnim(type,face);frame.sniffUntil=now+700;
  // 쓰다듬은 뒤의 속마음 & 가끔 주인의 한마디
  if(type==='shake')mouseThought('pet',{annoyed:true});
  else if(S.thoughtCtx!=='pet'||now-(S.thoughtAt||0)>8000)mouseThought('pet');
  if(type!=='shake'&&Math.random()<.3)ownerTalk('pet');
  save();renderAll();
  if(type!=='shake')particles(Math.random()<.5?'music':'heart',Math.random()<.5?1:2);
  squeakSound(line);
}
function squeak(text){
  const b=$('#squeak');b.textContent=text;b.classList.remove('hidden');
  b.style.animation='none';void b.offsetWidth;b.style.animation='';
  clearTimeout(sqT);sqT=setTimeout(()=>b.classList.add('hidden'),1700);
}
let AC=null;
function squeakSound(line){
  if(S.sound===false)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const n=clamp((line.match(/[찍쮝찌쮸]/g)||[]).length,1,5),long=/이이|~/.test(line),loud=/!!/.test(line);
    let t=AC.currentTime+.01;
    for(let i=0;i<n;i++){
      const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';
      const f0=2200+Math.random()*600+(loud?500:0),dur=long&&i===n-1?.34:.07;
      o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f0*1.5,t+dur*.6);o.frequency.exponentialRampToValueAtTime(f0*1.15,t+dur);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+dur);
      o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);t+=dur+.055;
    }
  }catch(e){}
}

  modal('모험에서 돌아왔어요!',`<p>${esc(fill('{m이}'))} <b style="font-weight:400">${r.name}</b>에서 돌아왔어요.</p>
    <div class="reward-list">${list}</div>
    ${lost?`<p class="note" style="color:#b0425a;opacity:1">보관함이 가득 차서 ${lost}개를 놓고 왔어요…</p>`:''}
    <p class="note">스트레스 +15 · 청결도 -20 · 포만감 -30<br>꼬질꼬질해졌어요. 씻겨주고 밥을 챙겨 주세요!</p>`,[{label:'수고했어!',cls:'pink'}]);
}

/* =========================================================
   상점 (기획서 6장)
========================================================= */
function renderShop(){
  $('#shopList').innerHTML=SHOP.map(it=>{
    const ownedDoll=it.id==='doll'&&(S.doll||(S.inv.doll>0));
    return`<div class="card pbox"><div class="top">${ico(it.icon,'xl')}<div><div class="nm">${it.name}</div><div class="ds">${it.desc}</div></div></div>
      <div class="bottom"><span class="price">${ico('seed')}${it.price}</span>
      <button class="pbtn ${ownedDoll?'':'butter'}" data-buy="${it.id}" ${ownedDoll||S.seeds<it.price?'disabled':''}>${ownedDoll?(S.doll?'배치 완료':'보유 중'):'구매'}</button></div></div>`}).join('');
  $('#shopList').onclick=e=>{const b=e.target.closest('[data-buy]');if(b)buy(b.dataset.buy)};
}
function buy(id){
  const it=SHOP.find(x=>x.id===id);
  if(S.seeds<it.price){toast('호박씨가 부족해요!');return}
  const[gid,n]=it.give;
  if(invFree()<n){toast(`보관함 공간이 부족해요! (남은 칸 ${invFree()})`);return}
  S.seeds-=it.price;invAdd(gid,n);save();renderAll();
  if(id==='salon'){toast('✂ 찍찍 살롱 이용권을 받았어요!');openSalon();return}
  if(id==='doll'){openDollSetup();return}
  toast(`${it.name} 구매 완료! 보관함에 넣었어요.`);
}

/* =========================================================
   보관함 (기획서 7장)
========================================================= */
function renderInv(){
  const tot=invTotal();
  $('#capBar').innerHTML=`${ico('bag','lg')}<span>용량 ${tot} / ${S.cap}</span><div class="pbar"><i style="width:${tot/S.cap*100}%"></i></div>
    <button class="pbtn sm butter" id="expandBtn" ${S.seeds<3?'disabled':''}>+10칸 확장 · ${ico('seed')}3</button>`;
  $('#expandBtn').onclick=()=>{if(S.seeds<3)return;S.seeds-=3;S.cap+=10;save();renderAll();toast(`보관함이 ${S.cap}칸으로 늘어났어요!`)};
  const ids=Object.keys(ITEMS).filter(k=>S.inv[k]>0);
  $('#invList').innerHTML=ids.length?ids.map(k=>{const it=ITEMS[k];
    return`<div class="card pbox"><div class="top">${ico(it.icon,'xl')}<div><div class="nm">${it.name} <span class="chip">×${S.inv[k]}</span></div><div class="ds">${it.desc}</div></div></div>
      <div class="bottom"><span></span>${it.use?`<button class="pbtn mint" data-use="${k}" ${(k==='rush'?!S.adv:!!S.adv)?'disabled':''}>사용</button>`:`<button class="pbtn" data-nav="home">간식 주러 가기</button>`}</div></div>`}).join('')
    :`<div class="empty pbox">보관함이 비어 있어요.<br>상점이나 모험에서 아이템을 모아 보세요!</div>`;
  $('#invList').onclick=e=>{const b=e.target.closest('[data-use]');if(b)useItem(b.dataset.use)};
}
function useItem(id){
  if(id==='rush'){if(!S.adv){toast('모험 중일 때만 사용할 수 있어요!');return}advAction('rush');return}
  if(S.adv){toast('모험 중에는 사용할 수 없어요!');return}
  if(!(S.inv[id]>0))return;
  if(id==='salon'){openSalon();return}
  if(id==='doll'){openDollSetup();return}
  invAdd(id,-1);
  if(id==='pea'){addStat('aff',5);toast(`완두콩 냠냠! 호감도 +5 (♥ ${Math.round(S.stats.aff)})`);afterUse('happy','heart','pea')}
  else if(id==='mounjiro'){const before=S.stats.weight;S.stats.weight=r1(Math.max(12,S.stats.weight-2));toast(`무게 ${r1(before)}g → ${S.stats.weight}g`);afterUse('jump','sparkle','mounjiro')}
  else if(id==='potion'){rollDay();S.reads.bonus++;toast(`🧪 오늘 속마음 읽기 +1회! (${readsLeft()}회 남음)`);afterUse('happy','bubble','potion')}
  ownerTalk('item');
}
function afterUse(a,fx,ctx){mouseThought(ctx);save();renderAll();
  if(window.innerWidth<=860)setView('home');playAnim(a);particles(fx,5)}

/* ---------- 애착 쥐의 애착 쥐: 배치 전 이름·색 설정 ---------- */
const DOLL_DEFAULT={name:'말랑이',color:'#D8B48A'};
const dollInfo=()=>S.dollInfo||DOLL_DEFAULT;
function openDollSetup(){
  let col=dollInfo().color;
  modal('🧸 애착 인형 꾸미기',`<p style="font-size:13px">${esc(fill('{m이}'))} 꼭 끌어안고 잘 인형이에요. 배치하기 전에 이름과 색을 정해 주세요.</p>
    <div class="preview pbox" style="height:120px;margin:10px 3px"><canvas id="dollPv"></canvas></div>
    <label class="f">인형 이름</label><input class="input" id="dollName" maxlength="8" value="${esc(dollInfo().name)}">
    <label class="f">인형 색상</label><div class="swatches" id="dollSw"></div>
    <div class="colorrow"><input type="color" id="dollColor" value="${col}"><span class="muted" style="font-size:12px">직접 고르기</span></div>`,
    [{label:'나중에 (보관함에 두기)'},{label:'배치하기',cls:'pink',fn:()=>{
      const nm=$('#dollName').value.trim();if(!nm){toast('인형 이름을 지어 주세요!');return false}
      if(!(S.inv.doll>0))return;
      invAdd('doll',-1);S.doll=true;S.dollInfo={name:nm,color:col};
      toast(`🧸 ${nm}${jo(nm,'을')} ${fill('{m}')} 옆에 놓아 주었어요!`);
      afterUse('happy','heart','doll');ownerTalk('item');
    }}]);
  const draw=()=>sizeCanvas(drawMouse($('#dollPv'),{color:col,plush:true,flip:true}),5);
  renderSwatches($('#dollSw'),col,c=>{col=c;$('#dollColor').value=c;draw()});
  $('#dollColor').oninput=e=>{col=e.target.value.toUpperCase();$$('#dollSw .sw').forEach(s=>s.classList.remove('on'));draw()};
  draw();
}
let dollTagT=null;
function pokeDoll(){
  if(!S.doll||S.adv)return;
  const t=$('#dollTag');t.textContent='🧸 '+dollInfo().name;t.classList.remove('hidden');
  clearTimeout(dollTagT);dollTagT=setTimeout(()=>t.classList.add('hidden'),1600);
  if(Math.random()<.5){squeak(fill(pick(['찍찍! ({d은} 내 친구예요)','찍! ({d}도 쓰다듬어 주세요)','찍찍~ ({d이랑} 같이 잘 거예요)'])));squeakSound('찍찍!')}
}

/* ---------- 찍찍 살롱 ---------- */
function openSalon(){
  let col=S.mouse.color;
  modal('✂ 찍찍 살롱',`<div class="preview pbox" style="height:140px;margin-bottom:10px"><canvas id="salonCv"></canvas></div>
    <label class="f">이름</label><input class="input" id="salName" maxlength="10" value="${esc(S.mouse.name)}">
    <label class="f">애칭</label><input class="input" id="salNick" maxlength="10" value="${esc(S.mouse.nick)}">
    <label class="f">털 색상</label><div class="swatches" id="salSw"></div>
    <div class="colorrow"><input type="color" id="salColor" value="${col}"><span class="muted" style="font-size:12px">직접 고르기</span></div>
    <p class="note" style="margin-top:8px">적용하면 이용권 1장이 사용돼요.</p>`,
    [{label:'나중에'},{label:'적용하기',cls:'pink',fn:()=>{
      const nm=$('#salName').value.trim();if(!nm){toast('이름을 입력해 주세요!');return false}
      S.mouse.name=nm;S.mouse.nick=$('#salNick').value.trim();S.mouse.color=col;invAdd('salon',-1);
      afterUse('happy','heart','salon');toast('변신 완료! 반짝반짝 ✨');
    }}]);
  const draw=()=>sizeCanvas(drawMouse($('#salonCv'),{color:col,weight:S.stats.weight,face:'happy'}),6);
  renderSwatches($('#salSw'),col,c=>{col=c;$('#salColor').value=c;draw()});
  $('#salColor').oninput=e=>{col=e.target.value.toUpperCase();$$('#salSw .sw').forEach(s=>s.classList.remove('on'));draw()};
  draw();
}

/* =========================================================
   프로필 / 설정
========================================================= */
function renderProf(){
  const o=S.owner,m=S.mouse,st=S.stats;
  $('#profBody').innerHTML=`
  <div class="section pbox"><h3>🐭 나의 쥐</h3>
    <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
      <canvas id="profCv"></canvas>
      <dl class="kv" style="flex:1;min-width:200px">
        <dt>이름</dt><dd>${esc(m.name)}${m.nick?` (“${esc(m.nick)}”)`:''}</dd>

        <dt>성격</dt><dd>${esc(m.personality)} <span class="muted" style="font-size:12px">— ${MOUSE_P[m.personality]}</span></dd>
        <dt>나이</dt><dd>D+${ageDays()}</dd>

        ${S.doll?`<dt>애착 인형</dt><dd><span class="sw" style="display:inline-block;width:14px;height:14px;background:${dollInfo().color};vertical-align:middle"></span> ${esc(dollInfo().name)}</dd>`:''}

  <div class="section pbox"><h3>🙋 주인님</h3>

/* =========================================================
   모달
========================================================= */
function modal(title,html,buttons){
  $('#modalBox').innerHTML=`<h2>${title}</h2><div>${html}</div><div class="modal-actions">${buttons.map((b,i)=>`<button class="pbtn ${b.cls||''}" data-mb="${i}">${b.label}</button>`).join('')}</div>`;
  $('#modal').classList.remove('hidden');
  $('#modalBox').querySelectorAll('[data-mb]').forEach(el=>el.onclick=()=>{const b=buttons[+el.dataset.mb];const r=b.fn?b.fn():undefined;if(r!==false)$('#modal').classList.add('hidden')});
}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.add('hidden')});

/* =========================================================
   루프 (씰룩/깜빡임, 모험 진행)
========================================================= */
function startLoops(){
  let tick=0,burst=0,nextBurst=Date.now()+600,nextBlink=Date.now()+2200,nextLook=Date.now()+6000,nextStand=Date.now()+7000;
  setInterval(()=>{
    if(!S)return;tick++;const now=Date.now();let ch=false;
    // 코·수염 씰룩: 짧게 몰아서 킁킁 → 잠깐 쉼
    if(now<frame.sniffUntil||burst>0){frame.twitch=!frame.twitch;ch=true;if(burst>0)burst--}
    else if(now>nextBurst){burst=6+Math.floor(Math.random()*6);nextBurst=now+1400+Math.random()*2600}
    else if(frame.twitch){frame.twitch=false;ch=true}
    // 가끔 일어서서 킁킁 (코를 치켜들었다 내렸다)
    const busy=Date.now()<anim.until||S.adv;
    if(frame.pose==='lie'&&!busy&&now>nextStand){
      frame.pose='stand';frame.standUntil=now+2400+Math.random()*1800;frame.sniffUntil=frame.standUntil;ch=true;
      const el=$('#mouseInner');el.classList.remove('rise');void el.offsetWidth;el.classList.add('rise');
      nextStand=now+9000+Math.random()*9000;
    }else if(frame.pose!=='lie'){
      if(now>frame.standUntil||busy){if(frame.pose!=='lie'){frame.pose='lie';ch=true;$('#mouseInner').classList.remove('rise')}}
      else if(tick%3===0){frame.pose=frame.pose==='stand'?'stand2':'stand';ch=true}
    }
    if(tick%5===0){frame.breath=!frame.breath;ch=true}            // 몸통 숨쉬기
    if(tick%7===0){frame.tail=!frame.tail;ch=true}                // 꼬리 살랑
    if(tick%2===0&&now<fx.shineUntil){frame.twinkle=!frame.twinkle;ch=true}
    if(now>nextBlink&&!frame.blink){frame.blink=true;ch=true;setTimeout(()=>{frame.blink=false;drawStageMouse()},150);nextBlink=now+1800+Math.random()*3200}
    if(now>nextLook&&!frame.look){frame.look=true;ch=true;setTimeout(()=>{frame.look=false;drawStageMouse()},1100);nextLook=now+5000+Math.random()*6000}
    if(ch&&!S.adv)drawStageMouse();
    if(S.adv){updateAdvProgress();checkAdventure()}
  },160);
  setInterval(()=>{if(S){rollDay();renderAll()}},60000);
}

/* =========================================================
   부트
========================================================= */
hydrateIcons();
S=load();
if(S&&S.owner&&S.mouse){
  const om={'활발함':'다정함'},mm={'먹보':'활발함','게으름':'얌전함'};
  if(om[S.owner.personality])S.owner.personality=om[S.owner.personality];
  if(mm[S.mouse.personality])S.mouse.personality=mm[S.mouse.personality];
  if(!OWNER_SAY[S.owner.personality])S.owner.personality='다정함';
  if(!MOUSE_P[S.mouse.personality])S.mouse.personality='얌전함';
  S.thoughtCtx=S.thoughtCtx||'idle';
  S.speed=1;
}
if(S&&S.owner&&S.mouse){startGame()}else{S=null;setupInit()}
</script>
